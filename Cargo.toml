[package]
name = "tdssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "OpenSSH over TwoDrive's iroh QUIC transport, with fail-closed physical egress"
repository = "https://github.com/LumiaBlack51/tdssh"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-dns = { version = "=1.3.0", default-features = false }
libc = "0.2"
n0-error = "1"
netdev = { version = "=0.46.3", default-features = false, features = ["gateway"] }
netwatch = "=0.19.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple-dns = "=0.12.0"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[patch.crates-io]
netwatch = { path = "vendor/netwatch" }

[profile.release]
lto = "thin"
strip = true
